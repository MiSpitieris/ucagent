name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra llm --extra ui
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test (mock only, no secrets)
        run: make test
