# Medium 2-hop MuSiQue run with gpt-oss:20b (overnight queue, user decision 2026-11-07 late evening).
# 200 train / 200 calibration / 200 test questions on fresh calibration and test indices (the first 60 of
# each were used by the development run, calibration 60..119 by the confirmatory pass, and eight test
# questions were inspected during the smoke runs). Same model options, prompts, labels, grids and target
# as configs/musique_confirm_gptoss.yaml; the grids were fixed before any of these questions were seen.
# Projected: about 11,000 calls, three hours at one call per second. Read the 0.1 target as a secondary
# line with `scripts/real_results.py results/musique_medium_gptoss --alpha-extra 0.1`.
kind: suite
suite_id: musique_medium_gptoss
base:
  run_id: musique_medium_gptoss
  seed: 0
  task:
    name: musique
    data_dir: data/musique
    n_steps: 2
    n_distractors: 3
    n_instances: {train: 200, calib: 200, test: 200}
    offset: {calib: 120, test: 60}  # calibration 120..319 and test 60..259 of the seeded orders: never run, never inspected
    seed: 0
    render_relations: true
    local_match: contains  # per-hop labels accept whole-word containment ("Foshan, Guangdong" for "Foshan"); the final answer stays exact match
  llm:
    backend: "ollama:gpt-oss:20b"
    K: 5
    K_prime: 10
    temperature: 0.7
    model_kwargs: {reasoning: low, num_ctx: 8192, num_predict: 1024}
  uq: {estimator: semantic_entropy, equivalence: normalized_contains}
  risk: {propagation: weighted, influence: ones}
  control:
    alpha: 0.2
    spending: linear
    costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 10.0}
    max_resamples: 1
    max_backtracks: 1
  oracle: {scope: local, p_h: 0.0, p_e: 0.0}
  calibration: {method: ltt, delta: 0.1, pvalue: binomial}
  limits: {max_llm_calls: 50000, max_concurrency: 4}
policies:
  none: null
  final_gate: {kind: linear, min: 0.05, max: 0.60, points: 12}
  per_step_eps: {kind: linear, min: 0.02, max: 0.40, points: 20}
  marginal: {kind: linear, min: 0.02, max: 0.40, points: 20}
  knowno: {kind: linear, min: 0.02, max: 0.30, points: 15}
  budgeted: {kind: log, min: 0.5, max: 4.0, points: 9}
  random_ask: {kind: linear, min: 0.0, max: 1.0, points: 11}
seeds: [0]
splits: [calib, test]
