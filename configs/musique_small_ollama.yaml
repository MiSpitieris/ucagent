# MuSiQue (2-hop, answerable) with a local open-weights model through the cache and cost guard.
# Small run (user decision 2026-11-07): 60 train / 60 calib / 60 test questions, K=5, K'=10.
# alpha=0.2 with n_c=60: the binomial test at delta=0.1 rejects only at <= 7 calibration errors.
#
# Pass 1 (2026-11-07 17:28-20:44, results/musique_small_ollama_strictparse) used the mock-sized
# grids of configs/musique_small_mock.yaml; with this model every calibrated step has eps >= 0.6,
# so those grids sat entirely in the "ask at every step" region. Pass 2 (this file) widens the
# grids to cover that region, after the parser fix of 4eaed95 (1 of 120 committed answers changed).
kind: suite
suite_id: musique_small_ollama
base:
  run_id: musique_small_ollama
  seed: 0
  task:
    name: musique
    data_dir: data/musique
    n_steps: 2
    n_distractors: 3
    n_instances: {train: 60, calib: 60, test: 60}
    seed: 0
    render_relations: false  # the archived runs used the raw 'X >> relation' templates (pinned for byte-identical prompts)
    local_match: exact  # strict per-hop labels, as in the archived runs (configs/musique_small_ollama_contains.yaml replays with containment)
  llm: {backend: "ollama:llama3.1:8b", K: 5, K_prime: 10, temperature: 0.7}
  uq: {estimator: semantic_entropy, equivalence: normalized_contains}
  risk: {propagation: weighted, influence: ones}
  control:
    alpha: 0.2
    spending: linear
    costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 10.0}
    max_resamples: 1
    max_backtracks: 1
  oracle: {scope: local, p_h: 0.0, p_e: 0.0}
  calibration: {method: ltt, delta: 0.1, pvalue: binomial}
  limits: {max_llm_calls: 50000, max_concurrency: 4}
policies:
  none: null
  final_gate: {kind: linear, min: 0.1, max: 1.0, points: 10}
  per_step_eps: {kind: linear, min: 0.1, max: 1.0, points: 10}
  marginal: {kind: linear, min: 0.1, max: 1.0, points: 10}
  knowno: {kind: linear, min: 0.05, max: 0.95, points: 10}
  budgeted: {kind: log, min: 0.25, max: 16.0, points: 7}
seeds: [0]
splits: [calib, test]
