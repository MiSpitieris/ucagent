# Primary signal: confidence-weighted agreement.
# Pre-registered rerun with wider grids (user decision 2026-11-08 afternoon). Experiment A showed that the 600-question
# fit resolves the entropy map into four levels (0.07 / 0.43 / 0.54 / 0.55) but the gate grid frozen at 0.02..0.40 lies
# below the three new levels, so the calibrated gate could not use them. This suite is the same 600-fit suite with the
# per_step_eps grid extended to 0.60 (30 points) and the marginal grid to 0.80 (40 points); every other grid, the
# questions, offsets, label, costs and target are unchanged. Everything replays from the cache except the fresh draws
# of steps redone after a backtrack. Predictions W1-W5 are in docs/EXPERIMENTS.md, written before launch.
kind: suite
suite_id: musique_wide_confagree
base:
  run_id: musique_wide_confagree
  seed: 0
  task:
    name: musique
    data_dir: data/musique
    n_steps: 2
    n_distractors: 3
    n_instances: {train: 600, calib: 200, test: 200}  # train indices 0..599 of the seeded order (200..599 never used before)
    offset: {calib: 120, test: 60}  # calibration 120..319 and test 60..259 of the seeded orders: never run, never inspected
    seed: 0
    render_relations: true
    local_match: contains  # per-hop labels accept whole-word containment ("Foshan, Guangdong" for "Foshan")
    final_match: contains  # the final answer is judged by the same rule as the hops (the strict exact-match number is printed alongside)
  llm:
    backend: "ollama:gpt-oss:20b"
    K: 5
    K_prime: 10
    temperature: 0.7
    model_kwargs: {reasoning: low, num_ctx: 8192, num_predict: 1024}
  uq: {estimator: confidence_agreement, equivalence: normalized_contains}
  risk: {propagation: weighted, influence: ones}
  control:
    alpha: 0.2
    spending: linear
    costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 10.0}
    max_resamples: 1
    max_backtracks: 1
  oracle: {scope: local, p_h: 0.0, p_e: 0.0}
  calibration: {method: ltt, delta: 0.1, pvalue: binomial}
  limits: {max_llm_calls: 50000, max_concurrency: 4}
policies:
  none: null
  final_gate: {kind: linear, min: 0.05, max: 0.60, points: 12}
  per_step_eps: {kind: linear, min: 0.02, max: 0.60, points: 30}  # widened from 0.40: the 600-question fit's levels reach 0.55
  marginal: {kind: linear, min: 0.02, max: 0.80, points: 40}  # widened from 0.40 for the same reason
  knowno: {kind: linear, min: 0.02, max: 0.30, points: 15}
  budgeted: {kind: log, min: 0.5, max: 4.0, points: 9}
  random_ask: {kind: linear, min: 0.0, max: 1.0, points: 11}
seeds: [0]
splits: [calib, test]
