# Price-sensitivity ablation on the mock (review of report v0.3, point 4): are the controllers'
# certified costs and their ordering sensitive to the price of a local review and of an escalation?
# Same task, model, grids and target as configs/suite_small.yaml, one seed; each variant changes
# control.costs only (with_updates replaces the whole costs block, so every variant lists all five).
# Not part of `make figures`: run `ucagent suite -c configs/ablation_prices.yaml` and render with
# `python scripts/results_table.py --suite results/ablation_prices` (Learn-then-Test per variant).
kind: suite
suite_id: ablation_prices
base:
  run_id: ablation_prices
  seed: 0
  task:
    name: synthetic_chain
    n_steps: 5
    ambiguity: {global: 0.5}
    distractors: 3
    reconvergence: {global: 0.0}
    n_instances: {train: 100, calib: 100, test: 100}
    seed: 0
  llm: {backend: mock, difficulty_beta: [2, 4], clean_factor: 0.2, K: 10, K_prime: 20}
  uq: {estimator: semantic_entropy, equivalence: normalized_exact}
  risk: {propagation: weighted, influence: counterfactual}
  control:
    alpha: 0.1
    spending: linear
    costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 10.0}
    max_resamples: 1
    max_backtracks: 1
  oracle: {scope: local, p_h: 0.0, p_e: 0.0}
  calibration: {method: ltt, delta: 0.1, pvalue: binomial}
  limits: {max_concurrency: 8}
policies:
  none: null
  final_gate: {kind: log, min: 0.01, max: 1.0, points: 6}
  per_step_eps: {kind: log, min: 0.005, max: 0.5, points: 6}
  marginal: {kind: log, min: 0.005, max: 1.0, points: 6}
  budgeted: {kind: linear, min: 0.25, max: 2.0, points: 6}
  random_ask: {kind: linear, min: 0.0, max: 1.0, points: 6}
variants:
  - {label: main, overrides: {}}   # ask_human 1.0, escalate 10.0 (the main suite's prices)
  - {label: ask_0.5, overrides: {control: {costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 0.5, escalate: 10.0}}}}
  - {label: ask_2, overrides: {control: {costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 2.0, escalate: 10.0}}}}
  - {label: escalate_5, overrides: {control: {costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 5.0}}}}
  - {label: escalate_20, overrides: {control: {costs: {llm_call: 0.01, resample: 0.0, backtrack: 0.5, ask_human: 1.0, escalate: 20.0}}}}
seeds: [0]
splits: [calib, test]
