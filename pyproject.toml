[project]
name = "ucagent"
version = "0.2.0"
description = "Uncertainty-controlled multi-step LLM agents on LangGraph: calibrated step risk, cost-aware interventions, finite-sample guarantees."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michail Spitieris", email = "michail.spitieris@sintef.no" }]
keywords = ["llm", "agents", "uncertainty", "calibration", "langgraph", "conformal"]
dependencies = [
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["langchain-ollama>=0.3", "langchain-anthropic>=0.3", "langchain-openai>=0.3"]
nli = ["sentence-transformers>=3.0"]
bench = ["datasets>=2.19"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "pandas-stubs",
  "types-PyYAML",
]
ui = ["streamlit>=1.56"]

[project.scripts]
ucagent = "ucagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/ucagent/experiments/ucagent.mplstyle" = "ucagent/experiments/ucagent.mplstyle"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "pyarrow.*", "langgraph.checkpoint.sqlite.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a real LLM backend (skipped unless UCAGENT_LLM_TESTS=1)", "slow: statistical end-to-end tests on the mock"]

[tool.coverage.run]
source = ["ucagent"]
